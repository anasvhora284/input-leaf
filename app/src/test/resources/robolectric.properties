# Robolectric installs Conscrypt as the JVM-wide TLS provider by default, and the
# Gradle test JVM is shared with plain-JVM tests. Conscrypt then reflects into
# java.net.InetAddress, which JDK 17 blocks, so every TLS test that happened to run
# after any Robolectric test failed its handshake. Keep TLS on the JDK provider.
conscryptMode=OFF
