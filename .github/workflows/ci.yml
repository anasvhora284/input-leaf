name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-jvm:
    name: fast-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run fast JVM tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :uhid-server:test

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-jvm-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            uhid-server/build/reports/tests/
            uhid-server/build/test-results/
          if-no-files-found: warn
          retention-days: 7
