codecov:
  notify:
    # Two CI jobs upload coverage (fast-jvm and android-coverage). Codecov waits for
    # both before publishing the combined project/patch status and the PR comment.
    after_n_builds: 2

parsers:
  jacoco:
    # Kotlin inline/lambda code maps several branches onto one source line; JaCoCo marks
    # such lines partial even when their executable paths ran. Count them as hits so the
    # 100% patch target measures genuinely unexecuted lines instead of mapping artifacts.
    partials_as_hits: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 100%
        threshold: 0%

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false
  hide_project_coverage: false
