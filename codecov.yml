codecov:
  notify:
    # Two CI jobs upload coverage (fast-jvm and android-coverage). Codecov waits for
    # both before publishing the combined project/patch status and the PR comment.
    after_n_builds: 2

parsers:
  jacoco:
    # Kotlin inline/lambda line maps often show as partials even when the branch ran.
    partials_as_hits: true
    # There is no Jacoco parser flag for a line with no probes. Codecov counts
    # an added source line missing from the report as a patch miss, and the
    # Android upload's miss wins when the JVM report has no counters for that
    # line. fast-jvm uploads scripts/codecov_skip_unprobed.py next to the Kover
    # XML: coverage -1 is skipped and leaves the patch denominator. The script
    # emits -1 only for lines with no counters (absent from the report, or
    # mi, ci, mb, and cb all zero). A missed instruction or a fully missed
    # branch is not marked, so it still fails the 100% target.
    # The Android job must not upload -1; a skip on either side would hide the
    # other job's miss.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 100%
        threshold: 0%

ignore:
  - "app/src/main/java/com/inputleaf/android/ui/**"
  - "app/src/main/java/com/inputleaf/android/service/**"
  - "app/src/main/java/com/inputleaf/android/shizuku/**"
  - "app/src/main/java/com/inputleaf/android/InputLeafApplication.kt"
  - "app/src/main/java/com/inputleaf/android/inject/AccessibilityInputService.kt"
  - "app/src/main/java/com/inputleaf/android/inject/AccessibilityInputInjector.kt"
  - "app/src/main/java/com/inputleaf/android/inject/InputLeafIME.kt"
  - "app/src/main/java/com/inputleaf/android/inject/KeysymInjection.kt"
  - "app/src/main/java/com/inputleaf/android/storage/AppPreferences.kt"
  - "app/src/main/java/com/inputleaf/android/storage/ClientCertificateStore.kt"
  - "app/src/test/**"
  - "app/src/androidTest/**"
  - "app/src/main/res/**"
  - "app/build.gradle.kts"
  - "codecov.yml"
  - ".gitignore"
  - "**/*.patch"

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false
  hide_project_coverage: false
