coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "app/src/main/java/com/inputleaf/android/ui/**/*"

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false
  hide_project_coverage: false
